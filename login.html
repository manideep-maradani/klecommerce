<!DOCTYPE html>
<html>
<head>
    <title>Food Delivery System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h2>Food Delivery</h2>
        <nav class="navtools">
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Offers</a>
            <a href="#">Log Out</a>
        </nav>
    </header>

    <div class="container">

        <div class="cards">
            <h2>Food</h2>

            <div class="food-list">
                <div class="card">
                    <img src="pizza.png" alt="Pizza">
                    <h3>Pizza</h3>
                    <p>₹999</p>
                    <button type="button" class="buttons">Order</button>
                </div>

                <div class="card">
                    <img src="ice cream.png" alt="Ice Cream">
                    <h3>Ice Cream</h3>
                    <p>₹249</p>
                    <button type="button" class="buttons">Order</button>
                </div>

                <div class="card">
                    <img src="biryani.png" alt="Chicken Biryani">
                    <h3>Chicken Biryani</h3>
                    <p>₹599</p>
                    <button type="button" class="buttons">Order</button>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <aside>
                <h2>Food Categories</h2>
                <h4>Breakfast</h4>
                <h4>Lunch</h4>
                <h4>Dinner</h4>
                <h4>Snacks</h4>
            </aside>
        </div>

    </div>

    <footer>
        <p>Thank you for visiting!</p>
    </footer>

</body>
</html>
